name: Workflow Scripts

on:
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/**"
      - "README.md"
      - "CLAUDE.md"
      - "AGENTS.md"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install PyYAML
        run: python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet --user --break-system-packages pyyaml

      # Runs every check below; needs no API secrets.
      - name: Run workflow checks
        run: bash .github/scripts/run-checks.sh
