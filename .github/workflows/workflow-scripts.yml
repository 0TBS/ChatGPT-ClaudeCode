name: Workflow Scripts

on:
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/**"

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: ShellCheck
        run: shellcheck .github/scripts/*.sh

      - name: Test review verdict check
        run: bash .github/scripts/test-check-review-verdict.sh
