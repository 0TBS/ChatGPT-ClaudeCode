name: Codex Architect

on:
  issues:
    types: [labeled]

jobs:
  architect:
    if: github.event.label.name == 'architect'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run Codex Architect
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt: |
            You are the senior architect for this repository.

            Read AGENTS.md.

            Analyze GitHub issue #${{ github.event.issue.number }}:

            TITLE:
            ${{ github.event.issue.title }}

            REQUEST:
            ${{ github.event.issue.body }}

            Inspect the existing repository.

            Create or update:

            docs/architecture.md
            docs/implementation-plan.md

            architecture.md should contain:
            - system design
            - components
            - database changes
            - APIs
            - security considerations
            - dependencies
            - important architectural constraints

            implementation-plan.md should contain:
            - numbered implementation tasks
            - affected files
            - acceptance criteria
            - tests required

            Do NOT implement the feature itself.

      - name: Commit architecture docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Ignore any git hooks Codex may have written into the workspace.
          git config core.hooksPath /dev/null

          for f in docs/architecture.md docs/implementation-plan.md; do
            if [ ! -f "$f" ]; then
              echo "Codex did not create $f."
              exit 1
            fi
          done

          # Drop anything Codex staged or committed, so only the two docs are published.
          git reset -q "$GITHUB_SHA"
          git add docs/architecture.md docs/implementation-plan.md

          unexpected=$(git diff --cached --name-only | grep -vxE 'docs/(architecture|implementation-plan)\.md' || true)
          if [ -n "$unexpected" ]; then
            echo "Refusing to commit unexpected paths:"
            echo "$unexpected"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "Codex did not create or change the architecture docs."
            exit 1
          fi

          git commit -m "Add architecture and implementation plan for #${{ github.event.issue.number }}"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
