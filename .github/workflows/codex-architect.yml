name: Codex Architect

on:
  issues:
    types: [labeled]

jobs:
  architect:
    if: github.event.label.name == 'architect'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run Codex Architect
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt: |
            You are the senior architect for this repository.

            Read AGENTS.md.

            Analyze GitHub issue #${{ github.event.issue.number }}:

            TITLE:
            ${{ github.event.issue.title }}

            REQUEST:
            ${{ github.event.issue.body }}

            Inspect the existing repository.

            Create or update:

            docs/architecture.md
            docs/implementation-plan.md

            architecture.md should contain:
            - system design
            - components
            - database changes
            - APIs
            - security considerations
            - dependencies
            - important architectural constraints

            implementation-plan.md should contain:
            - numbered implementation tasks
            - affected files
            - acceptance criteria
            - tests required

            Do NOT implement the feature itself.
