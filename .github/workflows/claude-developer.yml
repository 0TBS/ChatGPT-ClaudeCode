name: Claude Developer

on:
  issues:
    types: [labeled]

jobs:
  implement:
    if: github.event.label.name == 'implement'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          prompt: |
            You are the developer responsible for implementing this feature.

            Read:

            CLAUDE.md
            AGENTS.md
            docs/architecture.md
            docs/implementation-plan.md

            Implement the architecture exactly as specified.

            Requirements:

            - inspect the existing repository first
            - implement all tasks in implementation-plan.md
            - write appropriate tests
            - run tests
            - run lint
            - run typecheck if available
            - fix failures
            - do not redesign the architecture
            - do not replace technologies selected by the architect

            When finished, create a pull request containing the implementation.
